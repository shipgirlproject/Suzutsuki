import java.text.SimpleDateFormat

plugins {
    id "java"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

version = "2.5.0"

archivesBaseName = "suzutsuki"

compileJava.options.encoding = "UTF-8"

repositories {
    mavenCentral()
    maven {
        name "m2-dv8tion"
        url "https://m2.dv8tion.net/releases"
    }
}

dependencies {
    testImplementation('junit:junit:4.13.1')
    implementation("com.h2database:h2:2.3.230")
    implementation("net.dv8tion:JDA:6.7.0")
    implementation('io.vertx:vertx-core:5.2.1')
    implementation('io.vertx:vertx-web:5.1.7')
    implementation('io.vertx:vertx-web-client:5.1.5')
    implementation('com.fasterxml.jackson.core:jackson-core:2.22.3')
    implementation("com.fasterxml.jackson.core:jackson-annotations:2.17.2")
    implementation("org.json:json:20240303")
    implementation("org.slf4j:slf4j-api:2.0.13")
    implementation("org.slf4j:slf4j-log4j12:2.0.13")
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
            "Main-Class": "suzutsuki.SuzutsukiClient",
            "Build-Timestamp": new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSSZ").format(new Date()),
            "Implementation-Title": "Suzutsuki",
            "Implementation-Version": version
        )
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}